services:
  - type: web
    name: neurolens-api
    env: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: NEUROLENS_DB_PATH
        value: /var/data/neurolens.db
    disk:
      name: neurolens-data
      mountPath: /var/data
      sizeGB: 1
